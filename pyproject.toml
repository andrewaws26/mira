[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mira"
version = "0.1.0"
description = "Conversational telescope control for the Celestron NexStar 130SLT"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Andrew Sieg", email = "adsieg01@gmail.com" }
]
keywords = ["astronomy", "telescope", "celestron", "indi", "astap", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "skyfield>=1.46",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "pyserial>=3.5",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
]

[project.scripts]
mira = "mira.cli:main"
mira-mcp = "mira.mcp_server:main"

[project.urls]
Homepage = "https://github.com/andrewaws26/mira"
Repository = "https://github.com/andrewaws26/mira"
Issues = "https://github.com/andrewaws26/mira/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mira = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers"]
markers = [
    "hardware: tests requiring physical hardware (mount, camera)",
    "slow: tests that take more than a second",
    "online: tests that require network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
