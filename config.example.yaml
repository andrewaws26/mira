# Mira configuration. Copy this file to ~/mira/config.yaml and edit.
# All paths support ~ expansion.

observer:
  # Default coordinates are Louisville, KY. Override for your location.
  latitude: 38.2527        # degrees north, negative for southern hemisphere
  longitude: -85.7585      # degrees east, negative for west of Greenwich
  elevation_m: 142         # meters above sea level
  timezone: America/Kentucky/Louisville

mount:
  driver: celestron_nexstar
  # Find your serial port with: ls /dev/tty.usbserial-*
  # The exact suffix changes per FTDI cable.
  port: /dev/tty.usbserial-XXXX
  baud: 9600
  indi_host: localhost
  indi_port: 7624

camera:
  # Continuity Camera device name as seen by AVFoundation.
  # Run `imagesnap -l` to list available cameras.
  device_name: iPhone
  capture_dir: ~/mira/captures
  warmup_seconds: 1.0      # delay before capture, lets exposure settle

solver:
  astap_path: /usr/local/bin/astap
  # Star database name. H17 covers down to mag 17, H18 to mag 18.
  # H18 is larger but solves dimmer fields. Use H17 if disk space matters.
  star_db: H18
  # Estimated field of view in degrees for the iPhone afocal setup.
  # Tune after first successful solves.
  estimated_fov_deg: 0.5
  # How long to let ASTAP search before giving up.
  timeout_seconds: 60

eyepiece:
  focal_length_mm: 25
  fov_arcmin: 30           # approximate true field of view through this eyepiece

# Storage paths. These can stay at the defaults for most users.
storage:
  state_db: ~/mira/state.db
  log_file: ~/mira/mira.log

logging:
  level: INFO              # DEBUG, INFO, WARNING, ERROR

# Spoken output via ElevenLabs TTS. The API key is read from the
# ELEVENLABS_API_KEY env var or ~/mira/.env, never from this file.
# Find more voice IDs with: mira voices.
#
# Default voice (free tier): Sarah, EXAVITQu4vr4xnSDxMaL.
# Recommended upgrade voice (Starter plan, $6/mo): Vega, calm
# Spanish-accented English female narrator named after a bright
# star Mira will be pointing at. Add from the voice library, then
# set voice_id below.
speech:
  enabled: false
  voice_id: EXAVITQu4vr4xnSDxMaL  # Sarah: mature, reassuring, confident
  model_id: eleven_multilingual_v2
  blocking: false          # true makes the CLI wait for playback to finish
  # Voice expression knobs.
  # stability: 0.0-1.0; lower = more inflection, higher = more even/monotone
  # style:     0.0-1.0; higher = more emotional exaggeration
  # similarity_boost: 0.0-1.0; how closely to match the source voice
  stability: 0.30
  similarity_boost: 0.75
  style: 0.55
  use_speaker_boost: true
